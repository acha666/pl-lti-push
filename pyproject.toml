[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-lti-push"
version = "0.3.0"
description = "Scheduled PrairieLearn LTI 1.3 grade passback"
requires-python = ">=3.13"
dependencies = ["requests==2.32.5", "croniter==6.0.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.12"]

[project.scripts]
pl-lti-push = "pl_lti_push.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
