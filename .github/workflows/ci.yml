name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  formatting:
    name: Prettier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check

  python:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-build-isolation -e '.[dev]'
          python -m pip check
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q

  container:
    name: Container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: pl-lti-push:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test installed image
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:mode=1777 \
            --mount type=volume,target=/state -e SMOKE_DIR=/state \
            -v "$PWD/tests/container_smoke.py:/test.py:ro" \
            --entrypoint python pl-lti-push:ci /test.py
      - name: Validate Compose files
        env:
          PL_LTI_PUSH_IMAGE: ghcr.io/example/pl-lti-push:0.1.0
        run: |
          docker compose config --quiet
          docker compose -f compose.ghcr.yaml config --quiet
