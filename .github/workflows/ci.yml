name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  formatting:
    name: Prettier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check

  python:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-build-isolation -e '.[dev]'
          python -m pip check
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q

  container:
    name: Container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: pl-lti-push:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test installed image
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:mode=1777 \
            --mount type=volume,target=/state -e SMOKE_DIR=/state \
            -v "$PWD/tests/container_smoke.py:/test.py:ro" \
            --entrypoint python pl-lti-push:ci /test.py
      - name: Validate Compose files
        env:
          PL_LTI_PUSH_IMAGE: ghcr.io/example/pl-lti-push:0.1.0
        run: |
          docker compose config --quiet
          docker compose -f compose.ghcr.yaml config --quiet
